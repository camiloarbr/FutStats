version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: futstats-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    volumes:
      - sqlite-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: futstats-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite-data: